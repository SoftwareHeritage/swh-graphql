<!DOCTYPE html>
<html lang="en">
  <head>
    <title>SWH GraphQL explorer</title>
    <link rel="icon" type="image/x-icon" href="static/favicon.png">
    <style>
      body {
        height: 100%;
        margin: 0;
        width: 100%;
        overflow: hidden;
      }

      #graphiql {
        height: 95vh;
      }
    </style>
    <link rel="stylesheet"
          href="https://esm.sh/graphiql@5.4.0/dist/style.css"
          integrity="sha384-TFpQQKp325U5sd3PddH4cS0KOB3Gz/aqdEe12Mqkkq3wm2MGcDhRX5WhWf+o8akh"
          crossorigin="anonymous"/>
    <link rel="stylesheet"
          href="https://esm.sh/@graphiql/plugin-explorer@5.1.5/dist/style.css"
          integrity="sha384-vTFGj0krVqwFXLB7kq/VHR0/j2+cCT/B63rge2mULaqnib2OX7DVLUVksTlqvMab"
          crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha256-2FMn2Zx6PuH5tdBQDRNwrOo60ts5wWPC9R8jK67b3t4="
          crossorigin="anonymous">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">
          <span>Software Heritage GraphQL Explorer</span>
        </a>
        {% if auth %}
        <div id="swh-auth-info" class="float-right">
        </div>
        {% endif %}
      </div>
    </nav>
    <div id="graphiql">Loading...</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha256-5P1JGBOIxI7FBAvT/mb1fCnI5n/NhQKzNUuW7Hq0fMc="
            crossorigin="anonymous"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@19.3.0",
            "react/": "https://esm.sh/react@19.3.0/",
            "react-dom": "https://esm.sh/react-dom@19.3.0",
            "react-dom/": "https://esm.sh/react-dom@19.3.0/",
            "graphiql": "https://esm.sh/graphiql@5.4.0?standalone&external=react,react-dom,@graphiql/react,graphql",
            "graphiql/": "https://esm.sh/graphiql@5.4.0/",
            "@graphiql/plugin-explorer": "https://esm.sh/@graphiql/plugin-explorer@5.1.5?standalone&external=react,@graphiql/react,graphql",
            "@graphiql/react": "https://esm.sh/@graphiql/react@0.39.0?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
            "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql",
            "graphql": "https://esm.sh/graphql@17.0.2",
            "@emotion/is-prop-valid": "data:text/javascript,",
            "keycloak-js": "https://cdn.jsdelivr.net/npm/keycloak-js@26.2.4/lib/keycloak.js"
        },
        "integrity": {
            "https://esm.sh/react@19.3.0": "sha384-gq3XRS6InsfZ3Lv6d+6mBuySvNkEX/1Ciw3jSlg9gL82444AmhVcwtYbpJfKbDqf",
            "https://esm.sh/react-dom@19.3.0": "sha384-xodfSorG86jrGERFAa4P/93Hfsvm7H8zpgSaybN6ruXaACScu/R7nOuoDgCfep8l",
            "https://esm.sh/graphiql@5.4.0": "sha384-moUMjxK/ZmHQE08otOtzYT/Zke32MqPb9l0uUXUdsf8aXl53LPYBciaAf9ON2nuR",
            "https://esm.sh/graphiql@5.4.0?standalone&external=react,react-dom,@graphiql/react,graphql": "sha384-P5rs3WtMR+YUHbk+eUuomiB3Grin+04e9jKjuOY5KMBdjnl/qOUaCALfnVqVpIL8",
            "https://esm.sh/@graphiql/plugin-explorer@5.1.5": "sha384-hIrTiRjlICooYpU/kh97YrhFmYbV5WhIa37reJgertKXzyaM6kzkJaDUlQWs9+vb",
            "https://esm.sh/@graphiql/react@0.39.0?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid": "sha384-snSfFGTvNof5jyaw3xkRx7zsKRy9DWiljMvYXoo+zIwrhQv/h2pWOH81boYwk5P2",
            "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql": "sha384-+cNTwZgIW33q7A4E+ZoCMqzcXdfVIc2VthQvJ0uDpRXERBWYuDKPVMzvdQU8x48o",
            "https://esm.sh/graphql@17.0.2": "sha384-IPvlcmnvWT91sKqwbg9MxPXJUuPmSdwXCp22x6hcbBkAEhlfSKkMLR3v19K9iRUp",
            "https://cdn.jsdelivr.net/npm/keycloak-js@26.2.4/lib/keycloak.js": "sha256-EupeKGqQMIwszpdoxBqNDSck/wDAgAphT98ozUpD1D8="
        }
    }
    </script>
    <script type="module">
    {% if auth %}
    import Keycloak from 'keycloak-js'
    {% endif %}
    import React from 'react';
    import ReactDOM from 'react-dom/client';
    import { GraphiQL, HISTORY_PLUGIN } from 'graphiql';
    import { print, parse } from 'graphql';
    import { explorerPlugin } from '@graphiql/plugin-explorer';
    import 'graphiql/setup-workers/esm.sh';

    const QUERIES = {
        'default': `query findCodeMeta {directoryEntry(directorySWHID:"swh:1:dir:ec88e5b901c034d5a91aa133e824d65cff3788a3"
                    path:"codemeta.json"){name {text} target {node {... on Content {data {url raw{text base64}}}}}}}`,
        'lastCommits': `query latestCommits {origin(url: "https://github.com/hylang/hy") {url latestVisit(requireSnapshot: true) { date
                        latestStatus(requireSnapshot: true, allowedStatuses: [full]) {snapshot {swhid branches(first: 1) {nodes {
                        name {text} type target { swhid type node {... on Revision {revisionLog(first: 10) {nodes {swhid date {date
                        }author {fullname {text}} message {text}}}}}}}}}}}}}`,
        'originVisits': `fragment visitsFragment on VisitConnection {nodes {visitId date}} query originVisits {origin(url:
                        "https://github.com/python/cpython") {first: visits(first: 1, sort: ASC) {...visitsFragment}
                        last: visits(first: 1, sort: DESC) {...visitsFragment}}}`,
        'originEntries': `query getOriginEntries {origin(url: "https://github.com/hylang/hy") {url latestVisit(requireSnapshot: true) {
                        date latestStatus(requireSnapshot: true, allowedStatuses: [full]) {snapshot {swhid branches(first: 1, types: [revision]) {
                        pageInfo {endCursor hasNextPage} nodes {name {text} target {type node {... on Revision {swhid directory {
                        entries(first: 5, nameInclude: "A", after: "NQ==") {pageInfo {endCursor hasNextPage} edges {cursor node {
                        name {text}}}}}}}}}}}}}}}`,
        'latestSnapshot': `query latestSnapshot {origin(url: "https://github.com/python/cpython") {latestSnapshot {swhid}}}`
    };

    async function graphQLFetcher(graphQLParams, opts) {
        const { headers = {} } = opts;

        headers['Accept'] = 'application/json';
        headers['Content-Type'] = 'application/json';

        {% if auth %}
        if (keycloak.authenticated) {
            // ensure to renew access token if expired
            await keycloak.updateToken(10);
            headers['Authorization'] = 'Bearer ' + keycloak.token;
        }
        {% endif %}

        const response = await fetch(window.location.href, {
            method: 'post',
            headers: headers,
            body: JSON.stringify(graphQLParams),
        });

        return response.json();
    }

    function getQuery() {
        const urlParams = new URLSearchParams(window.location.search);
        let queryId = urlParams.get('queryId');

        if (!queryId || !(queryId in QUERIES)) {
            queryId = 'default';
        }
        const query = QUERIES[queryId];
        return print(parse(query));
    }

    function initGraphiQL() {
        const query = getQuery();
        const defaultTabs = [];
        for (const [title, query] of Object.entries(QUERIES)) {
            defaultTabs.push({
                title: title,
                query: print(parse(query))
            });
        }
        const root = ReactDOM.createRoot(document.getElementById('graphiql'));
        root.render(React.createElement(GraphiQL, {
            fetcher: graphQLFetcher,
            plugins: [HISTORY_PLUGIN, explorerPlugin()],
            initialQuery: query,
            defaultEditorToolsVisibility: true,
            defaultTabs: defaultTabs
        }));
    }

    {% if auth %}
    const keycloak = new Keycloak({
        url: '{{ auth.public_server }}',
        realm: '{{ auth.realm }}',
        clientId: '{{ auth.client }}',
    });

    globalThis.kcLogin = event => {
        event.preventDefault();
        keycloak.login();
    };

    globalThis.kcLogout = event => {
        event.preventDefault();
        keycloak.logout();
    };

    async function kcInitSuccess(authenticated) {
        const authInfo = document.querySelector('#swh-auth-info');
        if (authenticated) {
            const profile = await keycloak.loadUserProfile();
            authInfo.innerHTML = `Logged in as <strong>${profile.username.replace(/(<([^>]+)>)/ig, '')}</strong>`;
            authInfo.innerHTML += " - <a href='#' onclick='kcLogout(event)'>logout</a>";
        } else {
            authInfo.innerHTML = "<a href='#' onclick='kcLogin(event)'>login</a>";
        }
        initGraphiQL();
    }

    keycloak.init({
        onLoad: 'check-sso',
        pkceMethod: 'S256',
        checkLoginIframe: false,
    })
    .then(kcInitSuccess)
    .catch(initGraphiQL);
    {% else %}
    initGraphiQL();
    {% endif %}
    </script>
  </body>
</html>
